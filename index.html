                        <button onclick="setTerm('1')" id="term-btn-1" class="px-2.5 py-1 rounded-md text-xs font-bold transition-all bg-sky-500 text-white shadow-sm">
                            1. polrok
                        </button>
                        <button onclick="setTerm('2')" id="term-btn-2" class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all">

                    </button>

                    <button onclick="openModal('categoryModal')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all flex items-center gap-1.5 border border-slate-600/60 shadow-sm">
                        <i class="fa-solid fa-list-check text-indigo-400"></i>
                        <span class="hidden sm:inline">Kategórie</span>
                    </button>

                    <div class="h-5 w-px bg-slate-700 mx-1"></div>

                            <input type="radio" name="taskStatus" value="planned" class="sr-only" required>

                            <span class="text-xs font-bold">Preložené</span>

                <div class="flex items-center gap-2">

                </div>
            </div>

            <div id="categoryListContainer" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
        </div>
    </div>

            { id: 't-401', classId: 'cls-8', categoryId: 'cat-1', title: 'Južná Európa', status: 'completed' },
            { id: 't-402', classId: 'cls-8', categoryId: 'cat-2', title: 'Severná Európa', status: 'cancelled' },
            { id: 't-403', classId: 'cls-8', categoryId: 'cat-3', title: 'Južná Európa', status: 'planned' },
            { id: 't-404', classId: 'cls-8', categoryId: 'cat-4', title: 'Severná Európa', status: 'postponed' },
            { id: 't-405', classId: 'cls-8', categoryId: 'cat-5', title: 'Dánsko a Nórsko', status: 'completed' },
            { id: 't-406', classId: 'cls-8', categoryId: 'cat-6', title: 'Severná Európa', status: 'completed' },
            { id: 't-407', classId: 'cls-8', categoryId: 'cat-7', title: 'Talianska kuchyňa', status: 'completed' },
            { id: 't-501', classId: 'cls-9', categoryId: 'cat-1', title: 'Austrália', status: 'completed' },
            { id: 't-502', classId: 'cls-9', categoryId: 'cat-1', title: 'Oceánia', status: 'completed' },
            { id: 't-503', classId: 'cls-9', categoryId: 'cat-2', title: 'Príroda Ameriky', status: 'cancelled' },
            { id: 't-504', classId: 'cls-9', categoryId: 'cat-3', title: 'Pobrežie Austrálie', status: 'planned' },
            { id: 't-505', classId: 'cls-9', categoryId: 'cat-3', title: 'Austrália', status: 'planned' },
            { id: 't-506', classId: 'cls-9', categoryId: 'cat-3', title: 'Pobrežie Ameriky', status: 'planned' },
            { id: 't-507', classId: 'cls-9', categoryId: 'cat-4', title: 'Príroda Ameriky', status: 'postponed' },
            { id: 't-508', classId: 'cls-9', categoryId: 'cat-5', title: 'Poloha Ameriky', status: 'completed' },
            { id: 't-509', classId: 'cls-9', categoryId: 'cat-6', title: 'Štáty Oceánie', status: 'completed' },
            { id: 't-510', classId: 'cls-9', categoryId: 'cat-7', title: 'Spoločenská hra: Austrália', status: 'cancelled' }
        ];

        const PREDEFINED_COLOR_MAP = {
            'red-classic': { bgClass: 'bg-red-600', textClass: 'text-red-600', borderClass: 'border-red-500', shadowClass: 'shadow-red-900/30', hex: '#dc2626' },
            'red-openbook': { bgClass: 'bg-rose-500', textClass: 'text-rose-500', borderClass: 'border-rose-400', shadowClass: 'shadow-rose-900/30', hex: '#f43f5e' },
            'green-classic': { bgClass: 'bg-emerald-700', textClass: 'text-emerald-700', borderClass: 'border-emerald-600', shadowClass: 'shadow-emerald-900/30', hex: '#047857' },
            'green-openbook': { bgClass: 'bg-green-600', textClass: 'text-green-600', borderClass: 'border-green-500', shadowClass: 'shadow-green-900/30', hex: '#16a34a' },
            'orange': { bgClass: 'bg-amber-500', textClass: 'text-amber-500', borderClass: 'border-amber-400', shadowClass: 'shadow-amber-900/30', hex: '#f59e0b' },
            'purple': { bgClass: 'bg-purple-600', textClass: 'text-purple-600', borderClass: 'border-purple-500', shadowClass: 'shadow-purple-900/30', hex: '#9333ea' },
            'blue': { bgClass: 'bg-blue-600', textClass: 'text-blue-600', borderClass: 'border-blue-500', shadowClass: 'shadow-blue-900/30', hex: '#2563eb' }
        };

        let currentYear = '2026/2027';
        let currentTerm = '1';
        let firebaseListener = null;

        let state = {
            categories: [],
            classes: [],
            tasks: [],
            activeFilter: 'all'
        };

        function getCurrentRealPeriod() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;

            let startYear, endYear, term;
            if (month >= 9) {
                startYear = year;
                endYear = year + 1;
                term = '1';
            } else if (month <= 1) {
                startYear = year - 1;
                endYear = year;
                term = '1';
            } else {
                startYear = year - 1;
                endYear = year;
                term = '2';
            }

            return { year: `${startYear}/${endYear}`, term: term };
        }

        function getCategoryStyle(cat) {
            if (cat.hex) {
                return {
                    custom: true,
                    hex: cat.hex,
                    bgStyle: `background-color: ${cat.hex}`,
                    textStyle: `color: ${cat.hex}`,
                    borderStyle: `border-color: ${cat.hex}`
                };
            }
            const predefined = PREDEFINED_COLOR_MAP[cat.color] || PREDEFINED_COLOR_MAP['blue'];
            return {
                custom: false,
                bgClass: predefined.bgClass,
                textClass: predefined.textClass,
                borderClass: predefined.borderClass,
                shadowClass: predefined.shadowClass,
                hex: predefined.hex,
                bgStyle: '',
                textStyle: '',
                borderStyle: ''
            };
        }

        function getStorageKey() {
            const cleanYear = currentYear.replace('/', '_');
            return `geo_data_v5_${cleanYear}_T${currentTerm}`;
        }

        function saveStateToFirebase() {
            const key = getStorageKey();
            const payload = {
                categories: state.categories,
                classes: state.classes,
                tasks: state.tasks
            };
            db.ref('periods/' + key).set(payload);
            localStorage.setItem(key, JSON.stringify(payload));
        }

        function loadStateForCurrentPeriod() {
            const key = getStorageKey();

            if (firebaseListener) {
                db.ref('periods/' + key).off('value', firebaseListener);
            }

            const labelEl = document.getElementById('activePeriodLabel');
            if (labelEl) {
                labelEl.textContent = `Školský rok ${currentYear} • ${currentTerm}. polrok`;
            }

            firebaseListener = db.ref('periods/' + key).on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    state.categories = val.categories || DEFAULT_CATEGORIES;
                    state.classes = val.classes || DEFAULT_CLASSES;
                    state.tasks = val.tasks || DEFAULT_TASKS;
                } else {
                    const localData = localStorage.getItem(key);
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        state.categories = parsed.categories || DEFAULT_CATEGORIES;
                        state.classes = parsed.classes || DEFAULT_CLASSES;
                        state.tasks = parsed.tasks || DEFAULT_TASKS;
                    } else {
                        state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
                        state.classes = JSON.parse(JSON.stringify(DEFAULT_CLASSES));
                        state.tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
                    }
                    saveStateToFirebase();
                }
                renderMatrix();
            });
        }

        function initApp() {
            const lastYear = localStorage.getItem('geo_last_year');
            const lastTerm = localStorage.getItem('geo_last_term');

            if (lastYear && lastTerm) {
                currentYear = lastYear;
                currentTerm = lastTerm;
            } else {
                const realPeriod = getCurrentRealPeriod();
                currentYear = realPeriod.year;
                currentTerm = realPeriod.term;
            }

            const selectEl = document.getElementById('schoolYearSelect');
            if (selectEl) {
                if (![...selectEl.options].some(o => o.value === currentYear)) {
                    const opt = document.createElement('option');
                    opt.value = currentYear;
                    opt.textContent = currentYear;
                    opt.className = "bg-slate-800 text-white";
                    selectEl.appendChild(opt);
                }
                selectEl.value = currentYear;
            }

            updateTermButtonsUI();
            loadStateForCurrentPeriod();
        }

        function updateTermButtonsUI() {
            const btn1 = document.getElementById('term-btn-1');
            const btn2 = document.getElementById('term-btn-2');

            if (currentTerm === '1') {
                btn1.className = "px-2.5 py-1 rounded-md text-xs font-bold transition-all bg-sky-500 text-white shadow-sm";
                btn2.className = "px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all";
            } else {
                btn2.className = "px-2.5 py-1 rounded-md text-xs font-bold transition-all bg-sky-500 text-white shadow-sm";
                btn1.className = "px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition-all";
            }
        }

        function changePeriod() {
            const selectEl = document.getElementById('schoolYearSelect');
            currentYear = selectEl.value;
            localStorage.setItem('geo_last_year', currentYear);
            loadStateForCurrentPeriod();
        }

        function setTerm(term) {
            currentTerm = term;
            localStorage.setItem('geo_last_term', currentTerm);
            updateTermButtonsUI();
            loadStateForCurrentPeriod();
        }

        function setFilter(filter) {
            state.activeFilter = filter;
            ['all', 'completed', 'planned', 'postponed', 'cancelled'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (btn) {
                    if (f === filter) {
                        btn.className = "px-2.5 py-1 rounded-md bg-sky-500/20 text-sky-300 font-medium border border-sky-500/30 transition-all";
                    } else {
                        btn.className = "px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition-all";
                    }
                }
            });
            renderMatrix();
        }

        function renderMatrix() {
            const header = document.getElementById('matrixHeader');
            const body = document.getElementById('matrixBody');
            if (!header || !body) return;

            // Render Header
            let headerHTML = `<th class="w-32 sm:w-40 p-4 bg-slate-900/90 text-slate-400 font-bold text-xs uppercase tracking-wider sticky left-0 z-20 border-r border-slate-700/80 shadow-md">Trieda</th>`;
            
            state.categories.forEach(cat => {
                const style = getCategoryStyle(cat);
                const badgeStyle = style.custom ? style.bgStyle : '';
                const badgeClass = style.custom ? 'text-white' : `${style.bgClass} text-white`;

                headerHTML += `
                    <th class="p-3 text-center border-r border-slate-700/50 min-w-[140px]">
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-extrabold tracking-wide shadow-sm" style="${badgeStyle}">
                            <span class="${badgeClass} px-1.5 py-0.5 rounded text-[10px] font-black uppercase">
                                ${cat.name}
                            </span>
                        </div>
                    </th>
                `;
            });
            header.innerHTML = headerHTML;

            // Render Rows
            let bodyHTML = '';
            let totalTasks = 0;
            let completedTasks = 0;

            state.classes.forEach(cls => {
                bodyHTML += `<tr class="hover:bg-slate-800/30 transition-colors">`;
                bodyHTML += `
                    <td class="p-4 bg-slate-900/90 font-black text-slate-200 text-sm sm:text-base sticky left-0 z-10 border-r border-slate-700/80 flex items-center justify-between group">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-sky-500 shadow-sm shadow-sky-500/50"></span>
                            <span>${cls.grade} ${cls.section}</span>
                        </div>
                    </td>
                `;

                state.categories.forEach(cat => {
                    const cellTasks = state.tasks.filter(t => t.classId === cls.id && t.categoryId === cat.id);
                    totalTasks += cellTasks.length;
                    completedTasks += cellTasks.filter(t => t.status === 'completed').length;

                    const filteredTasks = cellTasks.filter(t => {
                        if (state.activeFilter === 'all') return true;
                        return t.status === state.activeFilter;
                    });

                    bodyHTML += `<td class="p-2 border-r border-slate-700/40 align-top h-24">`;
                    bodyHTML += `<div class="space-y-1.5 min-h-full flex flex-col justify-start">`;

                    filteredTasks.forEach(task => {
                        let statusClasses = "bg-slate-800 border-slate-600 text-slate-200";
                        let dotClass = "bg-slate-400";

                        if (task.status === 'completed') {
                            statusClasses = "bg-emerald-950/40 border-emerald-500/50 text-emerald-200 shadow-sm shadow-emerald-950/50";
                            dotClass = "bg-emerald-400";
                        } else if (task.status === 'planned') {
                            statusClasses = "bg-slate-100 border-slate-300 text-slate-900 font-medium shadow-sm";
                            dotClass = "bg-slate-600";
                        } else if (task.status === 'postponed') {
                            statusClasses = "bg-slate-800/80 border-slate-600 text-slate-400 italic";
                            dotClass = "bg-slate-500";
                        } else if (task.status === 'cancelled') {
                            statusClasses = "bg-slate-950/80 border-slate-800 text-slate-500 line-through opacity-60";
                            dotClass = "bg-slate-700";
                        }

                        const titleFormatted = (task.title || '').replace(/\n/g, '<br>');

                        bodyHTML += `
                            <div onclick="openTaskModal('${task.id}', '${cls.id}', '${cat.id}')" 
                                 class="cell-card p-2 rounded-xl border text-xs cursor-pointer hover:scale-[1.02] active:scale-[0.98] transition-all relative group/card ${statusClasses}">
                                <div class="flex items-start gap-1.5">
                                    <span class="w-2 h-2 rounded-full ${dotClass} mt-1 shrink-0"></span>
                                    <div class="leading-tight font-medium select-none break-words">${titleFormatted}</div>
                                </div>
                                ${task.note ? `<div class="text-[10px] opacity-75 mt-1 border-t border-current/10 pt-0.5 truncate"><i class="fa-solid fa-note-sticky mr-0.5"></i>${task.note}</div>` : ''}
                            </div>
                        `;
                    });

                    bodyHTML += `
                        <button onclick="openTaskModal(null, '${cls.id}', '${cat.id}')" 
                                class="w-full py-1 rounded-lg border border-dashed border-slate-700/60 hover:border-sky-500/50 hover:bg-sky-500/10 text-slate-500 hover:text-sky-400 text-xs transition-all flex items-center justify-center gap-1 opacity-40 hover:opacity-100 mt-auto">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                        </button>
                    `;

                    bodyHTML += `</div></td>`;
                });

                bodyHTML += `</tr>`;
            });

            body.innerHTML = bodyHTML;

            // Stats
            const statsEl = document.getElementById('statsSummary');
            if (statsEl) {
                const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
                statsEl.innerHTML = `Celkom: <b class="text-white">${totalTasks}</b> udalostí | Realizované: <b class="text-emerald-400">${completedTasks}</b> (${percent}%)`;
            }
        }

        // Modals
        function openModal(id) {
            const m = document.getElementById(id);
            if (m) {
                m.classList.remove('hidden');
                if (id === 'classModal') renderClassList();
                if (id === 'categoryModal') renderCategoryList();
            }
        }

        function closeModal(id) {
            const m = document.getElementById(id);
            if (m) m.classList.add('hidden');
        }

        function openTaskModal(taskId, classId, categoryId) {
            document.getElementById('taskId').value = taskId || '';
            document.getElementById('taskClassId').value = classId || '';
            document.getElementById('taskCategoryId').value = categoryId || '';

            const titleEl = document.getElementById('taskModalTitle');
            const btnDelete = document.getElementById('btnDeleteTask');

            if (taskId) {
                const task = state.tasks.find(t => t.id === taskId);
                if (task) {
                    document.getElementById('taskTitle').value = task.title || '';
                    document.getElementById('taskNote').value = task.note || '';
                    
                    const radios = document.getElementsByName('taskStatus');
                    radios.forEach(r => {
                        r.checked = (r.value === task.status);
                    });

                    if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square text-sky-400"></i> Úprava udalosti`;
                    if (btnDelete) btnDelete.classList.remove('hidden');
                }
            } else {
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskNote').value = '';
                
                const radios = document.getElementsByName('taskStatus');
                radios.forEach(r => {
                    r.checked = (r.value === 'planned');
                });

                if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-plus text-sky-400"></i> Nová udalosť`;
                if (btnDelete) btnDelete.classList.add('hidden');
            }

            openModal('taskModal');
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const classId = document.getElementById('taskClassId').value;
            const categoryId = document.getElementById('taskCategoryId').value;
            const title = document.getElementById('taskTitle').value;
            const note = document.getElementById('taskNote').value;
            
            let status = 'planned';
            const radios = document.getElementsByName('taskStatus');
            radios.forEach(r => { if (r.checked) status = r.value; });

            if (id) {
                const task = state.tasks.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.status = status;
                    task.note = note;
                }
            } else {
                state.tasks.push({
                    id: 't-' + Date.now(),
                    classId,
                    categoryId,
                    title,
                    status,
                    note
                });
            }

            saveStateToFirebase();
            closeModal('taskModal');
            showToast('Udalosť bola úspešne uložená');
        }

        function deleteCurrentTask() {
            const id = document.getElementById('taskId').value;
            if (id) {
                state.tasks = state.tasks.filter(t => t.id !== id);
                saveStateToFirebase();
                closeModal('taskModal');
                showToast('Udalosť bola vymazaná');
            }
        }

        // Classes Management
        function renderClassList() {
            const container = document.getElementById('classListContainer');
            if (!container) return;

            let html = '';
            state.classes.forEach((cls, index) => {
                html += `
                    <div class="flex items-center justify-between p-2.5 bg-slate-900/80 rounded-xl border border-slate-700/60">
                        <span class="font-bold text-sm text-slate-200">${cls.grade} ${cls.section}</span>
                        <button onclick="deleteClass('${cls.id}')" class="text-slate-500 hover:text-red-400 p-1.5 transition-colors">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addNewClass() {
            const input = document.getElementById('newClassName');
            const val = input.value.trim();
            if (!val) return;

            const parts = val.split(' ');
            const grade = parts[0] || val;
            const section = parts.slice(1).join(' ') || '';

            state.classes.push({
                id: 'cls-' + Date.now(),
                grade,
                section
            });

            input.value = '';
            saveStateToFirebase();
            renderClassList();
            showToast('Trieda bola pridaná');
        }

        function deleteClass(id) {
            if (confirm('Naozaj chcete vymazať túto triedu aj so všetkými jej udalosťami?')) {
                state.classes = state.classes.filter(c => c.id !== id);
                state.tasks = state.tasks.filter(t => t.classId !== id);
                saveStateToFirebase();
                renderClassList();
                showToast('Trieda bola vymazaná');
            }
        }

        // Categories Management
        function renderCategoryList() {
            const container = document.getElementById('categoryListContainer');
            if (!container) return;

            let html = '';
            state.categories.forEach(cat => {
                const style = getCategoryStyle(cat);
                const bgStyle = style.custom ? style.bgStyle : '';
                const bgClass = style.custom ? '' : style.bgClass;

                html += `
                    <div class="flex items-center justify-between p-2.5 bg-slate-900/80 rounded-xl border border-slate-700/60">
                        <div class="flex items-center gap-2">
                            <span class="w-3.5 h-3.5 rounded-full ${bgClass}" style="${bgStyle}"></span>
                            <span class="font-extrabold text-xs text-slate-200 tracking-wider">${cat.name}</span>
                        </div>
                        <button onclick="deleteCategory('${cat.id}')" class="text-slate-500 hover:text-red-400 p-1.5 transition-colors">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addNewCategory() {
            const nameInput = document.getElementById('newCategoryName');
            const hexInput = document.getElementById('newCategoryHex');

            const name = nameInput.value.trim().toUpperCase();
            const hex = hexInput.value;

            if (!name) return;

            state.categories.push({
                id: 'cat-' + Date.now(),
                name,
                hex
            });

            nameInput.value = '';
            saveStateToFirebase();
            renderCategoryList();
            showToast('Kategória bola pridaná');
        }

        function deleteCategory(id) {
            if (confirm('Naozaj chcete vymazať túto kategóriu aj so všetkými jej udalosťami?')) {
                state.categories = state.categories.filter(c => c.id !== id);
                state.tasks = state.tasks.filter(t => t.categoryId !== id);
                saveStateToFirebase();
                renderCategoryList();
                showToast('Kategória bola vymazaná');
            }
        }

        // Export & Import
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `geografia_export_${currentYear.replace('/', '_')}_T${currentTerm}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.categories && parsed.classes && parsed.tasks) {
                        state = parsed;
                        saveStateToFirebase();
                        showToast('Dáta boli úspešne importované');
                    } else {
                        alert('Neplatný formát súboru.');
                    }
                } catch (err) {
                    alert('Chyba pri čítaní JSON súboru.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (toast && toastMsg) {
                toastMsg.textContent = msg;
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }
        }

        // Start App
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
